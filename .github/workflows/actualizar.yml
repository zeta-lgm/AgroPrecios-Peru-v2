name: Actualizar precios
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás (30 normal; 730 para llenar el historial)"
        default: "30"
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: npm install cheerio@1.0.0 undici@6
      - run: node actualizar.mjs
        env:
          DIAS: ${{ inputs.dias || '30' }}
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add precios.json historial.json
          if ! git diff --staged --quiet; then
            git commit -m "Actualizar precios"
            git push
          fi
