name: Actualizar precios
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás (30 normal; luego 180, 365 y 730)"
        default: "30"
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        shell: powershell
        run: npm install cheerio@1.0.0 undici@6
      - name: Descargar precios
        shell: powershell
        run: node actualizar.mjs
        env:
          DIAS: ${{ inputs.dias || '30' }}
      - name: Guardar cambios
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add precios.json historial.json
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Actualizar precios"
            git push
          }
